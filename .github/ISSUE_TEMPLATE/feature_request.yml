name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you'd like to see. One feature per issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What problem does this solve? What's the workflow today?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "Sketch the API, CLI flag, or UI change."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Screenshots, mock-ups, prior art, links."
    validations:
      required: false