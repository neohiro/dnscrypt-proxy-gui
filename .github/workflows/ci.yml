name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      soft: ${{ steps.decide.outputs.soft }}
    steps:
      - name: Decide enforcement mode
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMITTER: ${{ github.event.head_commit.committer.name }}
          AGENT_ACTORS: ${{ vars.AGENT_ACTORS }}
        run: |
          soft=false
          if [ "$EVENT" = "push" ]; then
            case "$MSG" in *"[oc]"*|*"[skip-email]"*) soft=true;; esac
            if [ "$AUTHOR" = "OpenCode Agent" ]; then soft=true; fi
            if [ "$COMMITTER" = "OpenCode Agent" ]; then soft=true; fi
            if [ "$ACTOR" = "opencode-agent" ]; then soft=true; fi
            if [ -n "$AGENT_ACTORS" ]; then
              case ",$AGENT_ACTORS," in *",$ACTOR,"*) soft=true;; esac
            fi
          fi
          echo "soft=$soft"
          echo "soft=$soft" >> "$GITHUB_OUTPUT"
  test:
    name: Lint & Test (py${{ matrix.python-version }})
    needs: triage
    continue-on-error: ${{ needs.triage.outputs.soft == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (tk for tkinter, xvfb for the GUI smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==0.16.4" pytest

      - name: Lint (bug-prone constructs only)
        run: ruff check dnscrypt-proxy-gui.PY tests --select F,E722,B

      - name: Unit & Integration Tests (xvfb for tkinter)
        run: xvfb-run -a python -m pytest tests -q

      - name: GUI Smoke Test (headless)
        run: xvfb-run -a python tests/gui_smoke.py
