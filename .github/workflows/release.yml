name: Auto-Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $TAG (product version $VERSION)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pystray Pillow pyinstaller

      - name: Build Windows Executable
        if: matrix.os == 'windows-latest'
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Version metadata so Explorer shows a proper ProductVersion (#4)
          $maj, $min, $patch = $env:APP_VERSION.Split('.')
          @(
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($maj, $min, $patch, 0), prodvers=($maj, $min, $patch, 0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),',
            '  kids=[',
            "    StringFileInfo([StringTable('040904B0', [StringStruct('CompanyName', 'neohiro'), StringStruct('ProductName', 'DNSCrypt Proxy GUI'), StringStruct('ProductVersion', '$env:APP_VERSION'), StringStruct('FileVersion', '$env:APP_VERSION')])]),",
            "    VarFileInfo([VarStruct('Translation', [1033, 1200])])",
            '  ]',
            ')'
          ) | Set-Content -Path version.txt -Encoding Ascii
          pyinstaller --noconfirm --onedir --windowed --icon=icon.ico --version-file=version.txt dnscrypt-proxy-gui.PY
          Compress-Archive -Path "dist\dnscrypt-proxy-gui" -DestinationPath "dnscrypt-proxy-gui-$($env:APP_VERSION)-Windows-x64.zip" -Force

      - name: Build macOS Executable
        if: matrix.os == 'macos-latest'
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.icns dnscrypt-proxy-gui.PY
          cd dist
          zip -r "../dnscrypt-proxy-gui-$APP_VERSION-macOS.zip" dnscrypt-proxy-gui.app

      - name: Build Linux Executable
        if: matrix.os == 'ubuntu-latest'
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.png dnscrypt-proxy-gui.PY
          cd dist
          zip -r "../dnscrypt-proxy-gui-$APP_VERSION-Linux.zip" dnscrypt-proxy-gui

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
