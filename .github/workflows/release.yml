name: Auto-Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      matrix:
        # Linux builds on 22.04 on purpose: the bundled glibc (2.35) keeps the
        # executable compatible with older distributions.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version from tag
        id: ver
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="${RAW_TAG}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not strict semver (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $TAG (product version $VERSION)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.22.2"

      - name: Build Windows Executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Version metadata so Explorer shows a proper ProductVersion (#4)
          $maj, $min, $patch = ($env:APP_VERSION.Split('.') + @('0', '0', '0'))[0..2]
          @(
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            "    filevers=($maj, $min, $patch, 0), prodvers=($maj, $min, $patch, 0),",
            '    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),',
            '  kids=[',
            "    StringFileInfo([StringTable('040904B0', [StringStruct('CompanyName', 'neohiro'), StringStruct('ProductName', 'DNSCrypt Proxy GUI'), StringStruct('ProductVersion', '$env:APP_VERSION'), StringStruct('FileVersion', '$env:APP_VERSION')])]),",
            "    VarFileInfo([VarStruct('Translation', [1033, 1200])])",
            '  ]',
            ')'
          ) | Set-Content -Path version.txt -Encoding Ascii
          pyinstaller --noconfirm --onedir --windowed --icon=icon.ico --version-file=version.txt dnscrypt-proxy-gui.PY
          Compress-Archive -Path "dist\dnscrypt-proxy-gui" -DestinationPath "dnscrypt-proxy-gui-$($env:APP_VERSION)-Windows-x64.zip" -Force

      - name: Build macOS Executable
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.icns dnscrypt-proxy-gui.PY
          cd dist
          zip -r "../dnscrypt-proxy-gui-$APP_VERSION-macOS.zip" dnscrypt-proxy-gui.app

      - name: Build Linux Executable
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.png dnscrypt-proxy-gui.PY
          cd dist
          zip -r "../dnscrypt-proxy-gui-$APP_VERSION-Linux.zip" dnscrypt-proxy-gui

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.os }}
          path: |
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
